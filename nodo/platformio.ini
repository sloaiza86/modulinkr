; ModuLinkr, firmware del nodo.
;
; Plataforma: M5Stack Atom Lite (ESP32-PICO-D4).
; HATs:       Atom DTU LoRaWAN (STM32WLE5CC) + NB-IoT 2 Unit (SIM7028) + XY-MD02.
;
; H7: los parámetros del despliegue (identidad, red LoRa y mesh, NB-IoT y
; bus Modbus) viven en el config.json embebido (src/configs_embebidos.h,
; spec en shared/protocol/node-config.md), no en build_flags. El único
; flag de despliegue es NODE_CONFIG, que elige qué JSON se embebe.

[platformio]
default_envs = atom-lite

[env:atom-lite]
platform        = espressif32
board           = m5stack-atom
framework       = arduino

; Velocidad de subida y monitor
upload_speed    = 1500000
monitor_speed   = 115200

; Filtros del monitor, añaden timestamps y descodifican trazas de pánico
monitor_filters =
    time
    esp32_exception_decoder
    default

; Flags de compilación
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DMODEM_SIM7028       ; hardware del banco, solo etiqueta del banner
    -DNODE_CONFIG=1       ; config embebido: 1 = nodo lejano, 2 = supernodo
    -std=gnu++17

build_unflags =
    -std=gnu++11

; Librerías a descargar e instalar automáticamente.
; Sin pin de versión por ahora, PlatformIO coge la última estable.
; Pendiente pinear versiones concretas cuando se estabilice el firmware
; para garantizar reproducibilidad.
lib_deps =
    m5stack/M5Atom @ ^0.1.3
    m5stack/M5-LoRaWAN-RAK @ ^1.0.0
    https://github.com/m5stack/TinyGSM/archive/refs/tags/v0.12.0-patch-1.zip
    knolleary/PubSubClient @ ^2.8
    plerup/EspSoftwareSerial @ ^8.2.0
    fastled/FastLED
    bblanchon/ArduinoJson
