; ModuLinkr, firmware del nodo.
;
; Plataforma: M5Stack Atom Lite (ESP32-PICO-D4).
; HATs:       Atom DTU LoRaWAN (STM32WLE5CC) + NB-IoT 2 Unit (SIM7028) + XY-MD02.
;
; Para cambiar la región LoRa: comentar/descomentar la línea correspondiente
; en build_flags más abajo.

[platformio]
default_envs = atom-lite

[env:atom-lite]
platform        = espressif32
board           = m5stack-atom
framework       = arduino

; Velocidad de subida y monitor
upload_speed    = 1500000
monitor_speed   = 115200

; Filtros del monitor, añaden timestamps y descodifican trazas de pánico
monitor_filters =
    time
    esp32_exception_decoder
    default

; Flags de compilación
build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; -DREGION_US915      ; histórico: DTU original era US915, ya sustituido
    -DREGION_EU868        ; activo: DTU EU868 disponible desde 30 de junio de 2026
    -DMODEM_SIM7028
    -DLORA_TX_DBM=10      ; potencia baja para banco abierto, válida en ambas regiones
    -DLORA_FREQ_HZ=869525000UL  ; 869.525 MHz, banda g3, full power y duty cycle 10% con LBT
    -DNODE_ID=2           ; identificador u8 del nodo en este despliegue
    -DNETWORK_ID=1        ; identificador del despliegue (lora.network_id, 1-254)
    -DLORA_ACK_TIMEOUT_MS=3000  ; espera de ACK por trama (lora.ack_timeout_ms)
    -DLORA_MAX_RETRIES=2  ; retransmisiones con el mismo seq (lora.max_retries)
    -DLORA_MAX_TTL=4      ; ttl inicial de tramas propias (mesh.max_ttl)
    -DMESH_BEACON_TIMEOUT_MS=90000   ; caducidad de vecinos y padre (mesh.beacon_timeout_ms)
    -DMESH_PARENT_MIN_RSSI=-100      ; rssi minimo del beacon para ser padre (mesh.parent_min_rssi)
    -DMESH_PARENT_HYSTERESIS_DB=6    ; margen RSSI para cambiar de padre (mesh.parent_hysteresis_db)
    -DMESH_PARENT_MISSED_FRAMES=3    ; fallos seguidos que invalidan al padre (mesh.parent_missed_frames)
    -DMESH_RELAY_ENABLED=1           ; 1 releva tramas ajenas, 0 solo trafico propio (mesh.relay_enabled)
    -DNBIOT_ENABLED=0     ; 1 = supernodo (respaldo NB-IoT), 0 = nodo normal
    -DLORA_PERIOD_MS=5000     ; cadencia del canal LoRa
    -DMESH_SN_OFFER_WAIT_MS=1000     ; ventana de ofertas tras SN_REQUEST (mesh.sn_offer_wait_ms)
    -DNBIOT_APN='"nb.wlapn.com"'
    -DNBIOT_USER='"ENERBOSS"'
    -DNBIOT_PASS='"ENERBOSS"'
    -DMQTT_BROKER='"broker.hivemq.com"'
    -DMQTT_PORT=1883
    -DMQTT_TOPIC_BATCH='"modulinkr/v1/2/batch"'  ; topic de batches del supernodo (nbiot.topic_telemetry)
    -std=gnu++17

build_unflags =
    -std=gnu++11

; Librerías a descargar e instalar automáticamente.
; Sin pin de versión por ahora, PlatformIO coge la última estable.
; Pendiente pinear versiones concretas cuando se estabilice el firmware
; para garantizar reproducibilidad.
lib_deps =
    m5stack/M5Atom @ ^0.1.3
    m5stack/M5-LoRaWAN-RAK @ ^1.0.0
    https://github.com/m5stack/TinyGSM/archive/refs/tags/v0.12.0-patch-1.zip
    knolleary/PubSubClient @ ^2.8
    plerup/EspSoftwareSerial @ ^8.2.0
    fastled/FastLED
    bblanchon/ArduinoJson
