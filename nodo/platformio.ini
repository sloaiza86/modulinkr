; ModuLinkr — Firmware del nodo
;
; Plataforma: M5Stack Atom Lite (ESP32-PICO-D4)
; HATs:       Atom DTU LoRaWAN (STM32WLE5CC) + NB-IoT 2 Unit (SIM7028) + XY-MD02
;
; Para cambiar la región LoRa: comentar/descomentar la línea correspondiente
; en build_flags más abajo.

[platformio]
default_envs = atom-lite

[env:atom-lite]
platform        = espressif32
board           = m5stack-atom
framework       = arduino

; Velocidad de subida y monitor
upload_speed    = 1500000
monitor_speed   = 115200

; Filtros del monitor — añade timestamps y descodifica trazas de pánico
monitor_filters =
    time
    esp32_exception_decoder
    default

; Flags de compilación
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DREGION_US915        ; ← provisional: DTU disponible es US915
    ; -DREGION_EU868      ; ← descomentar cuando llegue el DTU EU868
    -DMODEM_SIM7028
    -std=gnu++17

build_unflags =
    -std=gnu++11

; Librerías a descargar e instalar automáticamente.
; Se irán añadiendo conforme avancemos por los hitos.
lib_deps =
    m5stack/M5Atom @ ^0.1.5
    fastled/FastLED @ ^3.6.0
    bblanchon/ArduinoJson @ ^7.0.4
    ; vshymanskyy/TinyGSM @ ^0.12.0   ; ← añadir en H3 (NB-IoT)
    ; 4-20ma/ModbusMaster @ ^2.0.1    ; ← opcional H1, dependiendo de si parseamos Modbus a mano o por librería
