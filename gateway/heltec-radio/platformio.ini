; ModuLinkr, firmware del front-end LoRa del gateway (Heltec WiFi LoRa 32 v3).
;
; Plataforma: Heltec WiFi LoRa 32 v3 (HTIT-WB32LAF, ESP32-S3 + SX1262).
; Rol: recibir tramas LoRa raw emitidas por nodos M5Stack Atom DTU LoRaWAN
; y entregarlas al Raspberry Pi del gateway por USB serial CDC.

[platformio]
default_envs = heltec_wifi_lora_32_V3

[env:heltec_wifi_lora_32_V3]
platform        = espressif32
board           = heltec_wifi_lora_32_V3
framework       = arduino

upload_speed    = 921600
monitor_speed   = 115200

monitor_filters =
    time
    esp32_exception_decoder
    default

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DLORA_FREQ_HZ=869525000UL    ; debe coincidir con el emisor Atom DTU
    -DLORA_SF=7                   ; spreading factor (7 a 12)
    -DLORA_BW_KHZ=125             ; bandwidth en kHz
    -DLORA_CR_DENOM=5             ; coding rate 4/5
    -DLORA_SYNC_WORD=0x12         ; LoRa private network (0x12) o LoRaWAN public (0x34)
    -DLORA_TX_DBM=10              ; potencia de las tramas que el Pi ordena transmitir, banco abierto
    -DNETWORK_ID=1                ; filtro de recepcion: descarta tramas de otras redes antes de volcarlas al Pi
    -std=gnu++17
    ; Desde el 5-jul-2026 el Heltec es radio pura (ver frame-format.md §12):
    ; ya no genera ACK ni BEACON, asi que LORA_MAX_TTL y BEACON_PERIOD_MS se
    ; eliminan. El Pi construye esas tramas con su propio ttl y cadencia.

build_unflags =
    -std=gnu++11

lib_deps =
    jgromes/RadioLib@^6.4.0
