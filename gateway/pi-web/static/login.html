<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ModuLinkr · Iniciar sesión</title>
<link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
<style>
/* Paleta compartida con style.css (colores del logo); página autónoma
   para no cargar la hoja completa del panel antes de autenticar. */
:root {
  --bg: #f4f6f9; --card: #ffffff; --text: #17224d; --dim: #5d6b85;
  --accent: #0756eb; --border: #e2e7f0; --error: #d64545;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center;
  padding: 2rem 1.25rem;
  background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.acceso {
  display: flex; flex-direction: column; align-items: center;
  width: min(100%, 520px);
}
.marca { width: 100%; margin: 0 0 1.5rem; text-align: center; }
.logo { display: block; width: min(100%, 480px); margin: 0 auto; }
.sub { color: var(--dim); margin: 0.35rem 0 0; font-size: 0.95rem; }
.tarjeta {
  width: min(100%, 368px); padding: 1rem;
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
}
h1 { margin: 0 0 1rem; font-size: 1.4rem; line-height: 1.25; font-weight: 600; }
.campo + .campo { margin-top: 0.9rem; }
label { display: block; color: var(--dim); font-size: 0.9rem; margin: 0 0 0.35rem; }
input {
  width: 100%; min-height: 48px; padding: 0 0.75rem; font: inherit; color: var(--text);
  border: 1px solid var(--border); border-radius: 10px; background: #fff;
}
input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
button {
  width: 100%; min-height: 46px; margin-top: 1.25rem; padding: 0.6rem 1rem; font: inherit;
  font-weight: 600; color: #fff; background: var(--accent);
  border: none; border-radius: 10px; cursor: pointer;
}
button:hover { filter: brightness(0.94); }
button:focus-visible { outline: 3px solid rgba(7, 86, 235, 0.28); outline-offset: 2px; }
.error {
  display: none; margin: 1rem 0 0; padding: 0.55rem 0.8rem;
  border-radius: 10px; font-size: 0.88rem;
  background: rgba(214, 69, 69, 0.10); color: var(--error);
}
body.con-error .error { display: block; }
.pie { text-align: center; margin: 1rem 0 0; font-size: 0.85rem; }
.pie a { color: var(--dim); text-decoration: none; }
.pie a:hover { color: var(--accent); text-decoration: underline; }
modulinkr-login-page { display: contents; }
@media (max-width: 420px) {
  body { padding: 1.5rem 1rem; }
  .marca { margin-bottom: 1.25rem; }
  .logo { width: min(100%, 390px); }
}
</style>
</head>
<body>
<modulinkr-login-page>
<main class="acceso">
  <header class="marca">
    <img class="logo" src="/static/img/logo.svg" alt="ModuLinkr">
    <p class="sub">Panel del gateway</p>
  </header>
  <form class="tarjeta" method="post" action="/login" aria-labelledby="titulo-acceso">
    <h1 id="titulo-acceso">Iniciar sesión</h1>
    <div class="campo">
      <label for="user">Usuario</label>
      <input id="user" name="user" autocomplete="username" autofocus required>
    </div>
    <div class="campo">
      <label for="pass">Contraseña</label>
      <input id="pass" name="pass" type="password" autocomplete="current-password" required>
    </div>
    <p class="error" role="alert">Usuario o contraseña incorrectos.</p>
    <button type="submit">Entrar</button>
  </form>
  <p class="pie"><a href="/cert" download>Descargar certificado</a></p>
</main>
</modulinkr-login-page>
<script src="/static/components.js"></script>
</body>
</html>
