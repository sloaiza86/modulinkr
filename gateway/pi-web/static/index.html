<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ModuLinkr</title>
<link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<aside id="sidebar">
  <div class="sb-cabecera">
    <button id="btn-menu" class="icono-btn" title="Contraer menú">
      <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <span class="sb-titulo"><img src="/static/img/logo-texto.svg" alt="ModuLinkr"></span>
  </div>
  <nav class="sb-nav">
    <a class="nav-item" href="#/red" data-view="red" title="Red">
      <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/></svg>
      <span>Red</span>
    </a>
    <a class="nav-item" href="#/topologia" data-view="topologia" title="Topología">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="4" r="2.6"/><circle cx="5" cy="19" r="2.6"/><circle cx="19" cy="19" r="2.6"/><line x1="12" y1="6.6" x2="5.8" y2="16.8"/><line x1="12" y1="6.6" x2="18.2" y2="16.8"/></svg>
      <span>Topología</span>
    </a>
    <a class="nav-item" href="#/datos" data-view="datos" title="Datos">
      <svg viewBox="0 0 24 24"><line x1="6" y1="20" x2="6" y2="11"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="18" y1="20" x2="18" y2="14"/></svg>
      <span>Datos</span>
    </a>
  </nav>
  <div class="sb-pie">
    <a class="nav-item" href="#/configuracion" data-view="configuracion" title="Configuración">
      <svg viewBox="0 0 24 24"><line x1="5" y1="4" x2="5" y2="10"/><circle cx="5" cy="13" r="2.4"/><line x1="5" y1="15.4" x2="5" y2="20"/><line x1="12" y1="4" x2="12" y2="6"/><circle cx="12" cy="9" r="2.4"/><line x1="12" y1="11.4" x2="12" y2="20"/><line x1="19" y1="4" x2="19" y2="13"/><circle cx="19" cy="16" r="2.4"/><line x1="19" y1="18.4" x2="19" y2="20"/></svg>
      <span>Configuración</span>
    </a>
    <a class="nav-item" id="btn-logout" href="/logout" title="Salir">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span>Salir</span>
    </a>
  </div>
</aside>

<div id="contenido">
  <header>
    <h1 id="titulo-vista">Red</h1>
    <span id="badge-red" class="badge" hidden></span>
    <div class="header-derecha">
      <span id="refresco"></span>
      <span id="clock"></span>
    </div>
  </header>

  <main>
    <section id="view-red" class="view">
      <div id="tarjetas" class="grid-tarjetas"></div>
      <p id="red-aviso" class="aviso"></p>
    </section>

    <section id="view-topologia" class="view" hidden>
      <div class="card card-mapa"><div id="mapa"></div></div>
      <p class="leyenda">Arista: hijo a padre (último eco de BEACON). Azul: gateway. Verde: en línea. Gris: sin tramas recientes.</p>
    </section>

    <section id="view-datos" class="view" hidden>
      <div id="datos-controles" class="card">
        <div id="selector-cabecera">
          <input type="search" id="filtro" placeholder="Filtrar nodos o medidas...">
          <div class="modo">
            <button class="modo-btn active" data-modo="nodo">Por nodo</button>
            <button class="modo-btn" data-modo="medida">Por medida</button>
          </div>
          <div class="vistas">
            <select id="vistas-guardadas"><option value="">Vistas guardadas...</option></select>
            <button id="btn-guardar-vista" title="Guardar la selección actual">Guardar</button>
            <button id="btn-borrar-vista" title="Borrar la vista elegida">Borrar</button>
          </div>
        </div>
        <div id="selector-canales"><p class="aviso">Cargando catálogo...</p></div>
        <div class="rango">
          <label>Desde <input type="datetime-local" id="desde"></label>
          <label>Hasta <input type="datetime-local" id="hasta"></label>
          <button id="btn-graficar">Graficar</button>
          <button id="btn-csv">Exportar CSV</button>
        </div>
      </div>
      <div id="grafico" class="card"></div>
      <p id="datos-aviso" class="aviso"></p>
    </section>

    <section id="view-configuracion" class="view" hidden>
      <div class="card construccion">
        <svg viewBox="0 0 24 24"><line x1="5" y1="4" x2="5" y2="10"/><circle cx="5" cy="13" r="2.4"/><line x1="5" y1="15.4" x2="5" y2="20"/><line x1="12" y1="4" x2="12" y2="6"/><circle cx="12" cy="9" r="2.4"/><line x1="12" y1="11.4" x2="12" y2="20"/><line x1="19" y1="4" x2="19" y2="13"/><circle cx="19" cy="16" r="2.4"/><line x1="19" y1="18.4" x2="19" y2="20"/></svg>
        <h2>En construcción</h2>
        <p>La configuración del gateway y de los nodos se gestionará desde aquí.</p>
      </div>
    </section>
  </main>
</div>

<!-- Panel lateral de detalle de nodo -->
<div id="detalle-fondo" hidden></div>
<aside id="detalle" hidden>
  <div class="detalle-cabecera">
    <h2 id="detalle-titulo"></h2>
    <button id="detalle-cerrar" class="icono-btn" title="Cerrar">
      <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>
  </div>
  <div id="detalle-cuerpo"></div>
</aside>

<!-- Modal de minigráfica de una medida (última hora, buffer local) -->
<div id="modal-fondo" hidden></div>
<div id="modal" hidden>
  <div class="modal-cabecera">
    <h2 id="modal-titulo"></h2>
    <button id="modal-cerrar" class="icono-btn" title="Cerrar">
      <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>
  </div>
  <div class="modal-sub">
    <span id="modal-cuando"></span>
    <span class="m-actual" id="modal-valor"></span>
  </div>
  <div id="modal-grafico"></div>
</div>

<div id="toasts"></div>

<script src="/static/vendor/vis-network.min.js"></script>
<script src="/static/vendor/echarts.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
